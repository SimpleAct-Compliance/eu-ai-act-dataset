    type: "recommendation"
    article: "Empfehlung"
    article_en: "Recommendation"
    roles:
      - "all_organisations"
    who:
      de: "alle Unternehmen"
      en: "all companies"
    duty:
      de: "Überblick über eingesetzte KI-Systeme (keine ausdrückliche Pflicht, aber Voraussetzung für jede Einstufung)"
      en: "Overview of the AI systems in use (no express obligation, but a prerequisite for any classification)"
    applies_from: []
    applies_from_text:
      de: "sofort empfohlen"
      en: "recommended now"
