meta:
  title: "EU AI Act obligations by role, article and application date"
  version: "1.0.0"
  as_of: "2026-11-24"
  legal_basis:
    - "Regulation (EU) 2024/1689 (AI Act)"
    - "Regulation (EU) 2026/1744 (Digital Omnibus on AI)"
  sources:
    - "https://eur-lex.europa.eu/eli/reg/2024/1689/oj"
    - "https://eur-lex.europa.eu/eli/reg/2026/1744/oj"
  publisher: "SimpleAct UG (haftungsbeschränkt)"
  license: "CC-BY-4.0"
  disclaimer: "Summaries for orientation, not the legal text and not legal advice. The text published in the Official Journal of the EU is authoritative."
obligations:
  - id: "all_organisations-art-4"
    category: "all_organisations"
    type: "obligation"
    article: "Art. 4"
    article_en: "Art. 4"
    roles:
      - "provider"
      - "deployer"
    who:
      de: "Anbieter, Betreiber"
      en: "Providers, deployers"
    duty:
      de: "Maßnahmen zur Förderung der KI-Kompetenz von Personal und Beauftragten ergreifen"
      en: "Take measures to support the AI literacy of staff and persons acting on your behalf"
    applies_from:
      - date: "2025-02-02"
        scope: "general"
    amended: "2026-07-27"
    applies_from_text:
      de: "2.2.2025 (neu gefasst 27.7.2026)"
      en: "2 Feb 2025 (reworded 27 Jul 2026)"
  - id: "all_organisations-art-5-1"
    category: "all_organisations"
    type: "obligation"
    article: "Art. 5 Abs. 1"
    article_en: "Art. 5(1)"
    roles:
      - "all_operators"
    who:
      de: "alle Akteure"
      en: "all operators"
    duty:
      de: "Verbotene Praktiken unterlassen"
      en: "Refrain from prohibited practices"
    applies_from:
      - date: "2025-02-02"
        scope: "general"
    applies_from_text:
      de: "2.2.2025"
      en: "2 Feb 2025"
  - id: "all_organisations-art-5-omnibus"
    category: "all_organisations"
    type: "obligation"
    article: "Art. 5 (Omnibus)"
    article_en: "Art. 5 (Omnibus)"
    roles:
      - "all_operators"
    who:
      de: "alle Akteure"
      en: "all operators"
    duty:
      de: "Neue Verbote: nicht einvernehmliche intime Deepfakes identifizierbarer Personen, Darstellungen sexuellen Kindesmissbrauchs"
      en: "New prohibitions: non-consensual intimate deepfakes of identifiable persons, child sexual abuse material"
    applies_from:
      - date: "2026-12-02"
        scope: "general"
    applies_from_text:
      de: "2.12.2026"
      en: "2 Dec 2026"
  - id: "all_organisations-recommendation"
