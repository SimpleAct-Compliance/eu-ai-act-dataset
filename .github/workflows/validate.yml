name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calendar files match deadlines.json
        run: |
          node scripts/build-ics.mjs
          git diff --exit-code -- data/deadlines.ics data/deadlines.de.ics
      - name: Validate data
        run: node scripts/validate.mjs
